<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b59">
  <title>البرنامج الأسبوعي</title>

  <style>
    :root {
      --navy: #173b59;
      --navy-dark: #102e48;
      --teal: #238b83;
      --text: #172e48;
      --muted: #74869a;
      --border: #dce6ee;
      --background: #f1f6fa;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #e1edf5, transparent 35%),
        var(--background);
      color: var(--text);
      min-height: 100vh;
      padding: 25px 16px;
    }

    .container {
      max-width: 1250px;
      margin: auto;
    }

    /* النصائح */
    .tip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 12px 16px;
      color: var(--navy);
      background: rgba(255, 255, 255, .8);
      border: 1px solid var(--border);
      border-radius: 15px;
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
      transition: opacity .3s ease;
    }

    .tip-icon {
      color: var(--teal);
      font-size: 18px;
      flex-shrink: 0;
    }

    /* العنوان */
    .hero {
      position: relative;
      overflow: hidden;
      text-align: center;
      color: white;
      background: linear-gradient(125deg, var(--navy-dark), #245778);
      border-radius: 24px;
      padding: 36px 20px;
      margin: 18px 0;
      box-shadow: 0 12px 35px #173b591c;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border: 1px solid #ffffff18;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::before {
      width: 240px;
      height: 240px;
      top: -155px;
      left: -45px;
    }

    .hero::after {
      width: 170px;
      height: 170px;
      bottom: -120px;
      right: -25px;
    }

    h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(29px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .title-line {
      width: 65px;
      height: 4px;
      border-radius: 10px;
      background: #6cc8bb;
      margin: 18px auto 0;
    }

    /* أزرار الجدول */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0 14px;
    }

    .toolbar-label {
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      cursor: pointer;
      transition: .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .print-btn {
      background: var(--navy);
      color: white;
    }

    .reset-btn {
      background: white;
      color: var(--navy);
      border: 1px solid var(--border);
    }

    /* الجدول */
    .table-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px #173b5910;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    thead th {
      color: white;
      background: var(--navy);
      padding: 19px 9px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      border-left: 1px solid #ffffff24;
    }

    thead th:first-child {
      background: var(--navy-dark);
      width: 105px;
    }

    tbody th {
      color: white;
      background: var(--navy);
      font-size: 15px;
      font-weight: bold;
      padding: 15px 8px;
      border-top: 1px solid #ffffff24;
      border-left: 1px solid #ffffff24;
      white-space: nowrap;
    }

    td {
      height: 84px;
      padding: 8px;
      text-align: center;
      background: white;
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td:last-child,
    th:last-child {
      border-left: 0;
    }

    .subject {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      width: 100%;
      padding: 7px 4px;
      border-radius: 10px;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
      overflow-wrap: anywhere;
      outline: none;
      transition: background .2s, box-shadow .2s;
    }

    .subject:hover {
      background: #f1f7fa;
    }

    .subject:focus {
      background: #eaf8f5;
      box-shadow: inset 0 0 0 2px #8bcfc4;
    }

    .subject:empty::before {
      content: "—";
      color: #a4b6c6;
    }

    .table-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 15px 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      background: #fbfdff;
      font-size: 12px;
      line-height: 1.8;
    }

    .edit-hint {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .edit-dot {
      width: 8px;
      height: 8px;
      background: var(--teal);
      border-radius: 50%;
    }

    /* التذييل */
    .bottom-tip {
      margin-top: 18px;
    }

    .signature {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
    }

    .signature a {
      display: inline-block;
      color: var(--navy);
      font-weight: 900;
      font-size: 14px;
      text-decoration: none;
      letter-spacing: 1px;
      padding: 5px 10px;
      border-radius: 8px;
      transition: .2s ease;
    }

    .signature a:hover {
      color: var(--teal);
      background: #e2efef;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px 9px;
      }

      .hero {
        padding: 29px 12px;
        border-radius: 18px;
      }

      .toolbar {
        align-items: flex-start;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .table-card {
        border-radius: 14px;
      }

      .tip {
        font-size: 12px;
        padding: 10px;
      }

      .table-footer {
        padding: 12px;
      }
    }

    @media print {
      @page {
        size: landscape;
        margin: 8mm;
      }

      body {
        padding: 0;
        background: white;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .container {
        max-width: 100%;
      }

      .toolbar,
      .actions,
      .edit-hint,
      .bottom-tip {
        display: none !important;
      }

      .hero {
        margin: 8px 0 14px;
        padding: 15px;
        border-radius: 10px;
        box-shadow: none;
      }

      h1 {
        font-size: 30px;
      }

      .table-card {
        box-shadow: none;
      }

      .table-scroll {
        overflow: visible;
      }

      table {
        min-width: 0;
      }

      thead th {
        padding: 12px 5px;
        font-size: 12px;
      }

      tbody th {
        padding: 10px 4px;
        font-size: 12px;
      }

      td {
        height: 60px;
        padding: 4px;
      }

      .subject {
        font-size: 11px;
        min-height: 35px;
      }

      .signature {
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- نصيحة تتغير في الأعلى -->
    <div class="tip">
      <span class="tip-icon">✦</span>
      <span id="topTip">نظّم وقتك اليوم، لتقترب من أهدافك غدًا.</span>
    </div>

    <!-- العنوان الوحيد -->
    <header class="hero">
      <h1>البرنامج الأسبوعي</h1>
      <div class="title-line"></div>
    </header>

    <div class="toolbar">
      <span class="toolbar-label">جدول الحصص الأسبوعي</span>

      <div class="actions">
        <button class="reset-btn" id="resetBtn" type="button">
          إعادة الجدول
        </button>

        <button class="print-btn" id="printBtn" type="button">
          طباعة الجدول
        </button>
      </div>
    </div>

    <!-- جدول المواد -->
    <section class="table-card" aria-label="البرنامج الأسبوعي">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">اليوم</th>
              <th scope="col">الحصة 1</th>
              <th scope="col">الحصة 2</th>
              <th scope="col">الحصة 3</th>
              <th scope="col">الحصة 4</th>
              <th scope="col">الحصة 5</th>
              <th scope="col">الحصة 6</th>
              <th scope="col">الحصة 7</th>
            </tr>
          </thead>

          <tbody id="scheduleBody"></tbody>
        </table>
      </div>

      <div class="table-footer">
        <span class="edit-hint">
          <span class="edit-dot"></span>
          اضغط على اسم المادة لتعديله
        </span>
        <span>تُحفظ التعديلات على جهازك تلقائيًا</span>
      </div>
    </section>

    <!-- نصيحة تتغير في الأسفل -->
    <div class="tip bottom-tip">
      <span class="tip-icon">✦</span>
      <span id="bottomTip">الاستمرار بخطوات صغيرة يصنع فرقًا كبيرًا.</span>
    </div>

    <!-- رابط MDCODES -->
    <footer class="signature">
      <a
        href="https://mahmoud-zureik.github.io/mahmoud-zureik/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="زيارة موقع MDCODES الشخصي"
        title="زيارة الموقع الشخصي"
      >MDCODES ↗</a>
    </footer>

  </main>

  <script>
    const originalSchedule = [
      {
        day: "الأحد",
        subjects: [
          "حاسوب", "رياضة", "عربي", "إنجليزية",
          "علوم", "رياضيات", ""
        ]
      },
      {
        day: "الإثنين",
        subjects: [
          "فيزياء", "كيمياء", "رياضة", "إنجليزية",
          "علوم", "رياضيات", ""
        ]
      },
      {
        day: "الثلاثاء",
        subjects: [
          "فرنسية", "فيزياء", "رياضيات", "عربي",
          "رياضيات", "عربي", ""
        ]
      },
      {
        day: "الأربعاء",
        subjects: [
          "علوم", "كيمياء", "عربي", "فيزياء",
          "رياضيات", "فلسفة", ""
        ]
      },
      {
        day: "الخميس",
        subjects: [
          "فنية", "فيزياء", "رياضيات", "إنجليزية",
          "فرنسية", "ديانة", "ديانة"
        ]
      }
    ];

    const storageKey = "mdcodes-weekly-program-v1";
    const scheduleBody = document.getElementById("scheduleBody");

    function renderSchedule(schedule) {
      scheduleBody.replaceChildren();

      schedule.forEach((row) => {
        const tr = document.createElement("tr");
        const dayCell = document.createElement("th");

        dayCell.scope = "row";
        dayCell.textContent = row.day;
        tr.appendChild(dayCell);

        row.subjects.forEach((subject, index) => {
          const td = document.createElement("td");
          const editor = document.createElement("div");

          editor.className = "subject";
          editor.contentEditable = "true";
          editor.setAttribute("role", "textbox");
          editor.setAttribute(
            "aria-label",
            row.day + "، الحصة " + (index + 1)
          );
          editor.setAttribute("spellcheck", "false");
          editor.textContent = subject;

          editor.addEventListener("input", saveSchedule);

          // منع إدخال أسطر جديدة داخل خلية المادة
          editor.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              editor.blur();
            }
          });

          td.appendChild(editor);
          tr.appendChild(td);
        });

        scheduleBody.appendChild(tr);
      });
    }

    function saveSchedule() {
      const currentSchedule = [...scheduleBody.querySelectorAll("tr")]
        .map((tr) => ({
          day: tr.querySelector("th").textContent,
          subjects: [...tr.querySelectorAll(".subject")]
            .map((cell) => cell.textContent.trim())
        }));

      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify(currentSchedule)
        );
      } catch (error) {
        // يبقى الجدول قابلًا للاستخدام إذا تعذر الحفظ
      }
    }

    function loadSchedule() {
      try {
        const saved = localStorage.getItem(storageKey);

        if (saved) {
          const parsed = JSON.parse(saved);

          if (
            Array.isArray(parsed) &&
            parsed.length === originalSchedule.length &&
            parsed.every(
              row =>
                row &&
                typeof row.day === "string" &&
                Array.isArray(row.subjects) &&
                row.subjects.length === 7 &&
                row.subjects.every(
                  subject => typeof subject === "string"
                )
            )
          ) {
            return parsed;
          }
        }
      } catch (error) {
        // استخدام الجدول الأصلي عند وجود بيانات غير صالحة
      }

      return originalSchedule;
    }

    // نصائح قصيرة تتغير بالتتابع
    const tips = [
      "نظّم وقتك اليوم، لتقترب من أهدافك غدًا.",
      "ابدأ بالأصعب، وستصبح بقية المهام أسهل.",
      "المراجعة اليومية أفضل من التأجيل.",
      "خذ استراحة قصيرة عندما تحتاج إلى تجديد نشاطك.",
      "لا تقارن تقدمك بالآخرين، ركّز على تطورك.",
      "اسأل عندما لا تفهم؛ فالسؤال بداية المعرفة.",
      "جهّز كتبك وأدواتك قبل بدء الدراسة.",
      "القليل من التركيز كل يوم يصنع إنجازًا كبيرًا.",
      "نم جيدًا، فالعقل المرتاح يتعلم بصورة أفضل.",
      "كل حصة فرصة جديدة لفهم شيء مفيد."
    ];

    let tipIndex = 0;

    function changeTips() {
      tipIndex = (tipIndex + 1) % tips.length;

      const topTip = document.getElementById("topTip");
      const bottomTip = document.getElementById("bottomTip");

      topTip.style.opacity = "0";
      bottomTip.style.opacity = "0";

      setTimeout(() => {
        topTip.textContent = tips[tipIndex];
        bottomTip.textContent =
          tips[(tipIndex + 4) % tips.length];

        topTip.style.opacity = "1";
        bottomTip.style.opacity = "1";
      }, 300);
    }

    document.getElementById("printBtn").addEventListener(
      "click",
      () => window.print()
    );

    document.getElementById("resetBtn").addEventListener(
      "click",
      () => {
        if (confirm("هل تريد إعادة الجدول إلى المواد الأصلية؟")) {
          try {
            localStorage.removeItem(storageKey);
          } catch (error) {}

          renderSchedule(originalSchedule);
        }
      }
    );

    renderSchedule(loadSchedule());

    document.getElementById("bottomTip").textContent =
      tips[4];

    setInterval(changeTips, 6000);
  </script>
</body>
</html>
